<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Thermochemistry Explorer 3D</title>
<style>
:root{--bg:#f3f0ff;--card:#fff;--tx:#1d1b3a;--mut:#58557d;--bd:#d6d0f7;--pri:#5b4bff;--exo:#e8431f;--endo:#0689b5;--yel:#d99a00;--ok:#0e8f4e;--bad:#d62839;--g:linear-gradient(135deg,#5b4bff,#b84bff 55%,#ff5a9d);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0b24;--card:#1a1740;--tx:#f1eeff;--mut:#b6b1de;--bd:#37337f;--pri:#9a90ff;--exo:#ff7a55;--endo:#35d0ff;--yel:#ffd24a;--ok:#3be08a;--bad:#ff6b7d}}
:root[data-theme=dark]{--bg:#0d0b24;--card:#1a1740;--tx:#f1eeff;--mut:#b6b1de;--bd:#37337f;--pri:#9a90ff;--exo:#ff7a55;--endo:#35d0ff;--yel:#ffd24a;--ok:#3be08a;--bad:#ff6b7d}
*{box-sizing:border-box}html{scroll-padding-top:70px}body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 12px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand{font-weight:800;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.1rem}
.sp{flex:1}.chip{border:1px solid var(--bd);border-radius:99px;padding:4px 12px;font-size:.85rem;background:var(--bg)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}nav button{white-space:nowrap}
button,select,input{font:inherit;color:var(--tx)}
.nb,.ib{min-height:44px;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:0 12px;cursor:pointer}.nb.on{background:var(--g);color:#fff;border-color:transparent}
.btn{min-height:44px;border:0;border-radius:14px;padding:0 18px;color:#fff;background:var(--g);font-weight:700;cursor:pointer;margin:4px 4px 4px 0}.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
main{max-width:1080px;margin:0 auto;padding:12px 14px 30px}
.card{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px);border:1px solid var(--bd);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 28px #5b4bff22}
h2{margin:.3em 0}h3{margin:.2em 0 .4em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero{background:var(--g);color:#fff;border-radius:28px;padding:26px 20px;position:relative;overflow:hidden}.hero h1{margin:0;font-size:clamp(1.5rem,5vw,2.6rem)}.hero .btn{background:#fff3;border:1px solid #fff8}
.fl{display:inline-block;font-size:2.4rem;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(6deg)}}
.stat{text-align:center}.stat b{font-size:1.7rem;display:block}.bar{height:14px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .6s}
input,select{min-height:42px;border:1px solid var(--bd);border-radius:10px;padding:4px 10px;background:var(--bg);max-width:100%}input[type=range]{width:100%;padding:0}
label{display:block;font-size:.9rem;color:var(--mut);margin:6px 0 2px}.r3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin:4px 0}.r3 input{width:100%}
.exo{color:var(--exo);font-weight:700}.endo{color:var(--endo);font-weight:700}.ok{color:var(--ok);font-weight:700}.err{color:var(--bad);font-weight:700}
.box{border-left:5px solid var(--pri);background:var(--bg);padding:10px 14px;border-radius:12px;margin:8px 0;overflow-x:auto}
.thermo{width:34px;height:150px;border:3px solid var(--mut);border-radius:20px;position:relative;background:var(--bg);overflow:hidden}.thermo i{position:absolute;bottom:0;left:0;right:0;transition:height 1.6s,background 1.6s}
.opt{display:block;width:100%;text-align:left;min-height:44px;margin:6px 0;border:2px solid var(--bd);background:var(--bg);border-radius:12px;padding:8px 12px;cursor:pointer}.opt.good{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.bdg{text-align:center;opacity:.45;filter:grayscale(1)}.bdg.got{opacity:1;filter:none}.bdg span{font-size:2rem}
canvas{max-width:100%}details{margin:6px 0}summary{cursor:pointer;font-weight:700;min-height:32px}
footer{text-align:center;padding:18px;border-top:1px solid var(--bd);background:var(--card);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center}#toast div{background:var(--pri);color:#fff;padding:8px 16px;border-radius:99px;font-weight:700}
.calm *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left}
</style></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<header><div class="top"><span class="brand">🔥 Thermochemistry Explorer 3D</span><span class="sp"></span><span class="chip" id="xpc"></span>
<button class="ib" onclick="tgTheme()" aria-label="Ganti mode terang atau gelap">🌗</button><button class="ib" onclick="tgCalm()" aria-label="Kurangi animasi">🎞️</button><button class="ib" onclick="tgSnd()" aria-label="Efek suara hidup atau mati" id="sndb">🔊</button></div><nav id="nav" aria-label="Navigasi utama"></nav></header>
<main id="main" tabindex="-1"></main><div id="toast" aria-live="polite"></div>
<footer>Copyright: Kimia Itu Gancil</footer>
<script>
const $=id=>document.getElementById(id),f=(x,d=1)=>(+x).toFixed(d).replace('.',',');
const D={xp:0,done:{},best:{},c:{},got:{},b:{},exp:0,last:'dash',hist:[],theme:'',calm:false,snd:true};
let S;try{S={...D,...JSON.parse(localStorage.getItem('tx3d')||'{}')}}catch(e){S={...D}}
const save=()=>{try{localStorage.setItem('tx3d',JSON.stringify(S))}catch(e){}};
const LV=[[0,'Energy Novice','🌱'],[60,'Heat Seeker','🔥'],[150,'Enthalpy Explorer','🧭'],[280,'Calorimetry Specialist','🌡️'],[450,'Hess Strategist','🧩'],[650,'Bond Energy Expert','⚛️'],[900,'Thermochemistry Master','🎓'],[1200,'Thermochemistry Legend','🏆']];
const lv=()=>{let l=0;LV.forEach((v,i)=>{if(S.xp>=v[0])l=i});return l};
const N={dash:['🏠','Dashboard'],dasar:['📚','Dasar'],eks:['⚖️','Eksoterm vs Endoterm'],diag:['📊','Diagram Energi'],pers:['📝','Persamaan Termokimia'],lab:['🧪','Lab Kalorimetri'],hess:['🧩','Puzzle Hess'],hrx:['🔬','Hitung ΔH Reaksi'],kalk:['🧮','Kalkulator'],hidup:['🌍','Kehidupan'],kuis:['🎯','Tantangan'],pus:['💡','Pusat Pengetahuan'],prof:['🏆','Profil']};
const M=['dasar','eks','diag','pers','lab','hess','hrx','kalk','hidup'];
const BD=[['🔥','Exothermic Expert','Tebak 3 reaksi dengan benar di modul Eksoterm vs Endoterm',()=>(S.c.pred||0)>=3],['❄️','Endothermic Explorer','Tebak benar 2 reaksi endoterm',()=>(S.c.endo||0)>=2],['📈','Energy Diagram Analyst','Jawab benar 3 tantangan diagram',()=>(S.c.diag||0)>=3],['🌡️','Calorimetry Master','Jalankan 3 eksperimen kalorimetri',()=>S.exp>=3],['🧩','Hess’s Law Solver','Selesaikan 3 level puzzle Hess',()=>(S.c.hess||0)>=3],['⚛️','Bond Energy Expert','Hitung dengan kalkulator energi ikatan',()=>S.got.k_bond],['🧮','Thermo Calculator Pro','Pakai keempat kalkulator',()=>['kalor','molar','hf','bond'].every(k=>S.got['k_'+k])],['🏆','Thermochemistry Legend','Lulus Level 5 (nilai ≥ 80%)',()=>(S.best[5]||0)>=80]];
function toast(m){const d=document.createElement('div');d.textContent=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),2600)}
function beep(ok){if(!S.snd)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?660:220;g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.15)}catch(e){}}
function xp(n,w){const o=lv();S.xp+=n;if(n)toast('+'+n+' XP · '+w);beep(1);if(lv()>o)toast('🎉 Naik level: '+LV[lv()][1]);BD.forEach((b,i)=>{if(!S.b[i]&&b[3]()){S.b[i]=1;toast('Badge baru: '+b[0]+' '+b[1])}});save();top_()}
const once=(k,n,w)=>{if(!S.got[k]){S.got[k]=1;xp(n,w)}};
const cnt=k=>{S.c[k]=(S.c[k]||0)+1;save()};
function top_(){$('xpc').textContent=LV[lv()][2]+' '+LV[lv()][1]+' · '+S.xp+' XP'}
function tgTheme(){S.theme=S.theme==='dark'?'light':'dark';apply();save()}
function tgCalm(){S.calm=!S.calm;apply();save()}
function tgSnd(){S.snd=!S.snd;apply();save()}
function apply(){if(S.theme)document.documentElement.dataset.theme=S.theme;document.body.classList.toggle('calm',S.calm);$('sndb').textContent=S.snd?'🔊':'🔇'}
let TM=[];const tm=(fn,ms)=>{const t=setInterval(fn,ms);TM.push(t);return t};
function go(id){TM.forEach(clearInterval);TM=[];if(!P[id])id='dash';S.last=id;save();$('main').innerHTML=P[id]();if(I[id])I[id]();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===id));if(location.hash!=='#'+id)location.hash=id;window.scrollTo(0,0)}
const doneBtn=id=>S.done[id]?'<p class="ok">✅ Materi selesai</p>':`<button class="btn" onclick="fin('${id}')">✔ Tandai selesai (+20 XP)</button>`;
function fin(id){if(!S.done[id]){S.done[id]=1;xp(20,'materi selesai')}go(id)}
const out=(id,h,e)=>$(id).innerHTML=e?`<p class="err">⚠️ ${e}</p>`:h;
/* ---------- PAGES ---------- */
const P={},I={};
P.dash=()=>{const l=lv(),nx=LV[l+1],pc=Math.round(M.filter(m=>S.done[m]).length/M.length*100),rec=M.find(m=>!S.done[m]),w=nx?Math.round((S.xp-LV[l][0])/(nx[0]-LV[l][0])*100):100,bn=Object.keys(S.b).length;
return `<div class="hero"><span class="fl">🧪</span><span class="fl" style="animation-delay:.5s">🌡️</span><span class="fl" style="animation-delay:1s">🔥</span><span class="fl" style="animation-delay:1.5s">❄️</span>
<h1>WELCOME TO THERMOCHEMISTRY EXPLORER 3D</h1><p><b>Jelajahi Energi, Pahami Reaksi, Taklukkan Termokimia!</b><br>Setiap reaksi memiliki cerita energi. Temukan bagaimana energi berpindah, kalor dilepaskan, dan perubahan entalpi menentukan arah eksperimen kimia!</p>
<button class="btn" onclick="go('${rec||'kuis'}')">🚀 Mulai Petualangan</button><button class="btn" onclick="go('dasar')">📚 Materi</button><button class="btn" onclick="go('lab')">🧪 Laboratorium</button><button class="btn" onclick="go('diag')">📊 Diagram</button><button class="btn" onclick="go('kalk')">🧮 Kalkulator</button><button class="btn" onclick="go('kuis')">🎯 Soal</button><button class="btn" onclick="go('prof')">🏆 Pencapaian</button></div>
<div class="card"><h3>${LV[l][2]} Level ${l+1}: ${LV[l][1]}</h3><div class="bar" role="progressbar" aria-valuenow="${w}" aria-valuemin="0" aria-valuemax="100"><i style="width:${w}%"></i></div><small>${S.xp} XP ${nx?'· '+(nx[0]-S.xp)+' XP lagi menuju '+nx[1]:'· Level tertinggi!'}</small></div>
<div class="grid"><div class="card stat"><b>${pc}%</b>Materi dipelajari</div><div class="card stat"><b>${S.exp}</b>Eksperimen</div><div class="card stat"><b>${Object.keys(S.best).length}</b>Level kuis dituntaskan</div><div class="card stat"><b>${bn}/8</b>Lencana</div></div>
<div class="card"><h3>▶ Lanjutkan & Rekomendasi</h3>${S.last&&S.last!=='dash'?`<button class="btn" onclick="go('${S.last}')">Lanjutkan: ${N[S.last][1]}</button>`:''}${rec?`<p>Rekomendasi berikutnya: <b>${N[rec][0]} ${N[rec][1]}</b> (+20 XP saat selesai)</p>`:'<p class="ok">Semua materi selesai! Coba tantangan soal.</p>'}<p>🔒 Level kuis terkunci dibuka bertahap: capai nilai minimal 70% / 75% / 75% / 80% pada level sebelumnya.</p></div>`};
/* DASAR */
const SYS={t:['Sistem terbuka','Materi ✔ dan energi ✔ dapat berpindah.','Panci air mendidih tanpa tutup.'],u:['Sistem tertutup','Materi ✘, energi ✔ dapat berpindah.','Botol air tertutup di bawah sinar matahari.'],i:['Sistem terisolasi','Materi ✘ dan energi ✘ tidak berpindah.','Termos ideal tertutup rapat (pendekatan).']};
P.dasar=()=>`<h2>📚 Energy Foundations</h2><div class="card"><h3>Apa itu termokimia?</h3><p>Termokimia mempelajari <b>perubahan kalor</b> yang menyertai reaksi kimia dan perubahan fisika. Contoh: pembakaran bahan bakar, pelarutan zat, pelelehan es, netralisasi, memasak, dan kantong dingin instan. Energi tidak diciptakan atau dimusnahkan; energi hanya berpindah atau berubah bentuk.</p></div>
<div class="card"><h3>Sistem, lingkungan, dan batas sistem</h3><p><b>Sistem</b> = bagian yang diamati (mis. larutan di gelas). <b>Lingkungan</b> = semua di luar sistem. <b>Batas</b> = pemisah keduanya. Pilih jenis sistem:</p><div class="row"><button class="btn alt" onclick="sys('t')">Terbuka</button><button class="btn alt" onclick="sys('u')">Tertutup</button><button class="btn alt" onclick="sys('i')">Terisolasi</button></div><div id="sysO" class="box">Pilih salah satu jenis sistem.</div></div>
<div class="card"><h3>🌡️ Kalor vs suhu: simulasi</h3><p><b>Suhu</b> = ukuran tingkat panas. <b>Kalor</b> = energi yang berpindah karena beda suhu, dari suhu tinggi ke rendah, hingga <b>kesetimbangan termal</b> (massa & kalor jenis sama dianggap).</p><div class="row"><div style="flex:1;min-width:200px"><label for="tA">Suhu benda A (°C)</label><input id="tA" type="range" min="40" max="100" value="90" oninput="hv()"></div><div style="flex:1;min-width:200px"><label for="tB">Suhu benda B (°C)</label><input id="tB" type="range" min="0" max="39" value="10" oninput="hv()"></div></div>
<div class="row" id="hs"></div><button class="btn" onclick="heat()">Sentuhkan A dan B</button><p id="hO"></p></div>${doneBtn('dasar')}`;
function sys(k){const s=SYS[k],o=k==='t',i=k==='i',w=i?9:4,dash=o?'10 8':'0',dot=(c,v,d,y)=>`<circle r='5' cy='${y}' fill='${c}'><animate attributeName='cx' values='${v}' dur='2.2s' begin='${d}s' repeatCount='indefinite'/></circle>`;$('sysO').innerHTML=`<b>${s[0]}</b><br>${s[1]}<br>Contoh: ${s[2]}<svg viewBox='0 0 440 240' role='img' aria-label='Ilustrasi sistem, lingkungan, dan batas sistem' style='width:100%;max-width:600px;display:block;margin-top:8px;border-radius:16px;border:1px solid var(--bd)'><rect width='440' height='240' fill='#ff9a5c33'/><text x='10' y='20' font-size='13' font-weight='700' fill='var(--tx)'>LINGKUNGAN: udara, meja, ruangan</text><rect x='120' y='50' width='200' height='140' rx='24' fill='#5b4bff33' stroke='${i?'var(--bad)':'var(--yel)'}' stroke-width='${w}' stroke-dasharray='${dash}'/><text x='220' y='115' text-anchor='middle' font-size='15' font-weight='700' fill='var(--tx)'>SISTEM</text><text x='220' y='135' text-anchor='middle' font-size='12' fill='var(--tx)'>larutan reaksi</text>${[0,1,2,3].map(n=>`<circle r='6' fill='#8f84ff' cx='${150+n*35}' cy='${75+(n%2)*90}'><animate attributeName='cy' values='${75+(n%2)*90};${95+(n%2)*50};${75+(n%2)*90}' dur='${1.2+n*.3}s' repeatCount='indefinite'/></circle>`).join('')}${i?`<text x='30' y='120' font-size='16' fill='var(--bad)'>✘ energi</text><text x='335' y='120' font-size='16' fill='var(--bad)'>✘ materi</text>`:`${dot('var(--exo)','20;140;20',0,100)}${dot('var(--endo)','140;20;140',1.1,130)}<text x='8' y='165' font-size='12' fill='var(--tx)'>● energi ⇄</text>`}${o?`${dot('var(--ok)','200;420;200',0,80)}${dot('var(--ok)','420;200;420',1.1,160)}<text x='335' y='205' font-size='12' fill='var(--tx)'>● materi ⇄</text>`:''}${k==='u'?`<text x='335' y='120' font-size='16' fill='var(--bad)'>✘ materi</text>`:''}<text x='220' y='215' text-anchor='middle' font-size='12' font-weight='700' fill='var(--tx)'>▲ BATAS SISTEM (${i?'garis merah tebal: tidak ada pertukaran':o?'garis putus-putus: terbuka':'garis kuning: tertutup'})</text></svg>`}
let hA,hB;const hc=t=>`hsl(${Math.round(230-t*2.1)} 90% 55%)`;
function hv(){hA=+$('tA').value;hB=+$('tB').value;hd()}
function hd(){$('hs').innerHTML=`<div style="flex:1;min-width:120px;background:${hc(hA)};color:#fff;border-radius:16px;padding:18px;text-align:center;font-weight:700">A<br>${f(hA)} °C</div><div style="font-size:1.6rem">⇄</div><div style="flex:1;min-width:120px;background:${hc(hB)};color:#fff;border-radius:16px;padding:18px;text-align:center;font-weight:700">B<br>${f(hB)} °C</div>`}
function heat(){hv();$('hO').textContent='Kalor mengalir dari A (panas) ke B (dingin) →';tm(()=>{const d=hA-hB;if(d<.1){$('hO').textContent='✅ Kesetimbangan termal tercapai: kedua benda '+f(hA)+' °C. Kalor berhenti mengalir.';once('heat',10,'simulasi kalor');return TM.forEach(clearInterval)}hA-=d*.08;hB+=d*.08;hd()},60)}
I.dasar=()=>{hv();sys('t')};
/* EKS */
const RX=[['Pembakaran metana: CH₄ + 2O₂ → CO₂ + 2H₂O','x','Melepas kalor ke lingkungan; ΔH°c ≈ −890 kJ/mol.'],['Netralisasi HCl + NaOH → NaCl + H₂O','x','Melepas kalor; ΔH ≈ −57 kJ/mol air.'],['Pelarutan NaOH dalam air','x','Pelarutan melepas kalor, wadah terasa hangat.'],['Pelarutan NH₄NO₃ dalam air (kompres dingin instan)','n','Menyerap kalor dari air sekitarnya sehingga suhu turun.'],['Penguraian CaCO₃ → CaO + CO₂ (dipanaskan)','n','Memerlukan pasokan kalor terus-menerus; ΔH positif.'],['Pelelehan es (proses fisika)','n','Es menyerap kalor dari lingkungan untuk meleleh.']];
P.eks=()=>`<h2>⚖️ Exothermic vs Endothermic</h2><div class="grid"><div class="card" style="border-color:var(--exo)"><h3 class="exo">🔥 Eksoterm</h3><p>Sistem <b>melepas</b> kalor ke lingkungan. Entalpi produk lebih rendah. <b>ΔH &lt; 0</b>. Suhu lingkungan dapat naik.</p></div><div class="card" style="border-color:var(--endo)"><h3 class="endo">❄️ Endoterm</h3><p>Sistem <b>menyerap</b> kalor dari lingkungan. Entalpi produk lebih tinggi. <b>ΔH &gt; 0</b>. Suhu lingkungan dapat turun.</p></div></div>
<div class="card"><h3>🔮 Prediksi dulu, lihat hasilnya</h3><label for="rx">Pilih reaksi</label><select id="rx">${RX.map((r,i)=>`<option value="${i}">${r[0]}</option>`).join('')}</select><label for="pd">Prediksi kamu</label><select id="pd"><option value="x">🔥 Eksoterm (ΔH &lt; 0)</option><option value="n">❄️ Endoterm (ΔH &gt; 0)</option></select><br><button class="btn" onclick="pred()">🔒 Kunci jawaban</button>
<div class="row"><div class="thermo" aria-label="Termometer lingkungan"><i id="th" style="height:50%;background:var(--yel)"></i></div><div id="pO" style="flex:1;min-width:200px">Kunci jawabanmu untuk melihat termometer dan penjelasan.</div></div><div id='eI'></div><div id='eA'></div></div>
<details class="card"><summary>Tabel perbandingan</summary><table><tr><th>Aspek</th><th>Eksoterm</th><th>Endoterm</th></tr><tr><td>Perpindahan kalor</td><td>Sistem → lingkungan</td><td>Lingkungan → sistem</td></tr><tr><td>Tanda ΔH</td><td>Negatif</td><td>Positif</td></tr><tr><td>Entalpi produk</td><td>Lebih rendah</td><td>Lebih tinggi</td></tr><tr><td>Suhu lingkungan</td><td>Dapat naik</td><td>Dapat turun</td></tr></table><p><small>Perubahan suhu yang terukur bergantung kondisi eksperimen, kapasitas kalor, dan pertukaran kalor dengan lingkungan.</small></p></details>${doneBtn('eks')}`;
function pred(){const i=+$('rx').value,r=RX[i],ok=$('pd').value===r[1],ex=r[1]==='x';$('th').style.height=ex?'85%':'20%';$('th').style.background=ex?'var(--exo)':'var(--endo)';

function plot(cv,ser,p){const c=$(cv),x=c.getContext('2d'),W=c.width,H=c.height,tx=getComputedStyle(document.body).color;x.clearRect(0,0,W,H);const all=ser.flatMap(s=>[s.a,s.b]),mn=Math.min(...all)-2,mx=Math.max(...all)+2,X=u=>50+u*(W-70),Y=t=>H-35-(t-mn)/(mx-mn)*(H-55);x.strokeStyle=tx;x.fillStyle=tx;x.font='13px sans-serif';x.beginPath();x.moveTo(50,10);x.lineTo(50,H-35);x.lineTo(W-15,H-35);x.stroke();x.fillText(f(mx)+'°C',2,18);x.fillText(f(mn)+'°C',2,H-35);x.fillText('waktu (0–120 s) →',W/2-40,H-8);
ser.forEach(s=>{x.strokeStyle=s.col;x.lineWidth=3;x.beginPath();for(let i=0;i<=60*p;i++){const u=i/60,g=(1-Math.exp(-5*u))/(1-Math.exp(-5)),t=s.a+(s.b-s.a)*g;i?x.lineTo(X(u),Y(t)):x.moveTo(X(u),Y(t))}x.stroke();x.fillStyle=s.col;x.fillText(s.n,X(.02),Y(s.a)-6)})}

<div class="card"><h3>A. Pencampuran dua larutan (q = m·c·ΔT)</h3><div class="grid"><div><label for="m1">Massa 1 (g)</label><input id="m1" type="number" value="100"></div><div><label for="a1">Suhu awal 1 (°C)</label><input id="a1" type="number" value="60"></div><div><label for="m2">Massa 2 (g)</label><input id="m2" type="number" value="100"></div><div><label for="a2">Suhu awal 2 (°C)</label><input id="a2" type="number" value="20"></div><div><label for="cc1">c (J/g°C)</label><input id="cc1" type="number" step="any" value="4.18"></div></div><button class="btn" onclick="mix()">🧴 Campurkan Larutan</button><div id='cal1'></div><canvas id="cv1" width="600" height="240"></canvas><div id="mO"></div></div>
<div class="card"><h3>B. Netralisasi asam kuat–basa kuat</h3><p>HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l). Model menggunakan ΔH = −57,1 kJ/mol H₂O.</p><div class="grid"><div><label for="va">Volume asam (mL)</label><input id="va" type="number" value="50"></div><div><label for="ma">Konsentrasi asam (M)</label><input id="ma" type="number" step="any" value="1"></div><div><label for="vb">Volume basa (mL)</label><input id="vb" type="number" value="50"></div><div><label for="mb">Konsentrasi basa (M)</label><input id="mb" type="number" step="any" value="1"></div><div><label for="t0">Suhu awal (°C)</label><input id="t0" type="number" value="25"></div><div><label for="ls">Kehilangan kalor ke lingkungan: <span id="lsv">0</span>%</label><input id="ls" type="range" min="0" max="30" value="0" oninput="$('lsv').textContent=this.value"></div></div><button class="btn" onclick="neu()">⚗️ Campurkan Larutan</button><div id='cal2'></div><canvas id="cv2" width="600" height="240"></canvas><div id="nO"></div></div>${doneBtn('lab')}`;
function mix(){try{const m1=num('m1','Massa 1'),m2=num('m2','Massa 2'),c=num('cc1','Kalor jenis'),a=num('a1','Suhu 1',null),b=num('a2','Suhu 2',null),tf=(m1*a+m2*b)/(m1+m2),q1=m1*c*(tf-a),q2=m2*c*(tf-b);
anim('cv1',[{a,b:tf,col:'#ff5a36',n:'Larutan 1'},{a:b,b:tf,col:'#1ab7ea',n:'Larutan 2'}]);calSvg('cal1',a,tf,'#8a5cff');
out('mO',`<div class="box">T akhir = (m₁T₁ + m₂T₂)/(m₁+m₂) = (${f(m1)}×${f(a)} + ${f(m2)}×${f(b)})/${f(m1+m2)} = <b>${f(tf,2)} °C</b><br>q₁ = ${f(m1)}×${f(c,2)}×(${f(tf,2)}−${f(a)}) = <b>${f(q1,0)} J</b> ${q1<0?'(melepas kalor)':'(menyerap kalor)'}<br>q₂ = ${f(m2)}×${f(c,2)}×(${f(tf,2)}−${f(b)}) = <b>${f(q2,0)} J</b> ${q2<0?'(melepas kalor)':'(menyerap kalor)'}<br>q₁ + q₂ = ${f(q1+q2,0)} J → kalor yang dilepas sama dengan kalor yang diserap (tanpa kehilangan kalor).</div>`);run('Pencampuran: '+f(m1)+' g/'+f(a)+'°C + '+f(m2)+' g/'+f(b)+'°C → '+f(tf,1)+'°C')}catch(e){out('mO','',e)}}
function neu(){try{const va=num('va','Volume asam'),ma=num('ma','Konsentrasi asam'),vb=num('vb','Volume basa'),mb=num('mb','Konsentrasi basa'),t0=num('t0','Suhu awal',null),l=+$('ls').value/100,na=va*ma/1000,nb=vb*mb/1000,n=Math.min(na,nb),m=va+vb,dT=n*57100/(m*4.18)*(1-l),tf=t0+dT,q=m*4.18*dT,dh=-q/n/1000;
anim('cv2',[{a:t0,b:tf,col:'#b84bff',n:'Campuran'}]);calSvg('cal2',t0,tf,'#b84bff');
out('nO',`<div class="box">n asam = ${f(na,3)} mol; n basa = ${f(nb,3)} mol → pereaksi pembatas: <b>${na<nb?'asam':nb<na?'basa':'keduanya habis'}</b>; n H₂O = <b>${f(n,3)} mol</b><br>ΔT simulasi = ${f(dT,2)} °C → T akhir = ${f(tf,2)} °C<br>q larutan = ${f(m)}×4,18×${f(dT,2)} = ${f(q,0)} J<br>q reaksi ≈ −q larutan = <b>${f(-q,0)} J</b> (eksoterm)<br>ΔH ≈ −${f(q/1000,3)} kJ ÷ ${f(n,3)} mol = <b>${f(dh)} kJ/mol H₂O</b>${l>0?`<br><small>Kehilangan kalor ${f(l*100,0)}% membuat |ΔH| hasil hitung lebih kecil dari −57,1.</small>`:''}</div>`);run('Netralisasi: ΔH ≈ '+f(dh)+' kJ/mol')}catch(e){out('nO','',e)}}
function calSvg(id,a,b,col){col=col||'#b84bff';const lo=Math.min(a,b)-3,hi=Math.max(a,b)+3,mh=t=>25+(t-lo)/(hi-lo)*85;$(id).innerHTML=`<svg viewBox='0 0 340 215' role='img' aria-label='Kalorimeter sederhana: gelas isolasi, tutup, termometer, pengaduk, larutan' style='width:100%;max-width:380px;border-radius:16px;border:1px solid var(--bd);background:var(--bg)'><rect x='60' y='98' width='160' height='104' rx='12' fill='#b9bfdc' stroke='var(--mut)' stroke-width='3'/><rect x='75' y='108' width='130' height='88' rx='8' fill='var(--card)' stroke='var(--mut)'/><rect x='77' y='128' width='126' height='66' rx='6' fill='${col}' opacity='.6'/><rect x='52' y='92' width='176' height='11' rx='4' fill='var(--mut)'/><rect x='150' y='30' width='12' height='135' rx='6' fill='var(--card)' stroke='var(--tx)' stroke-width='2'/><rect id='${id}M' x='154' y='130' width='4' height='30' fill='var(--exo)'/><g><line x1='190' y1='40' x2='190' y2='180' stroke='var(--tx)' stroke-width='3'/><circle cx='190' cy='38' r='5' fill='var(--tx)'/><animateTransform attributeName='transform' type='translate' values='-12 0;12 0;-12 0' dur='1.2s' repeatCount='indefinite'/></g><rect x='6' y='14' width='72' height='30' rx='6' fill='#111'/><text id='${id}T' x='42' y='35' text-anchor='middle' font-size='14' fill='#3be08a' font-family='monospace'>${f(a)}°C</text><g font-size='11' fill='var(--tx)'><text x='235' y='45'>Termometer</text><text x='235' y='75'>Pengaduk</text><text x='235' y='100'>Tutup</text><text x='235' y='150'>Larutan</text><text x='235' y='190'>Gelas isolasi</text></g></svg>`;let k=0;const set=t=>{const m=$(id+'M'),h=mh(t);if(!m)return;m.setAttribute('y',160-h);m.setAttribute('height',h);$(id+'T').textContent=f(t)+'°C'};set(a);if(S.calm)return set(b);const iv=tm(()=>{k++;const u=k/40,g=(1-Math.exp(-5*u))/(1-Math.exp(-5));set(a+(b-a)*g);if(k>=40)clearInterval(iv)},60)}
I.lab=()=>{calSvg('cal1',25,25);calSvg('cal2',25,25)};
/* HESS */
const HL=[{t:'C(s) + ½O₂(g) → CO(g)',H:-110.5,r:[['C(s) + O₂(g) → CO₂(g)',-393.5],['CO(g) + ½O₂(g) → CO₂(g)',-283.0]],a:[1,-1]},{t:'2C(s) + O₂(g) → 2CO(g)',H:-221,r:[['C(s) + O₂(g) → CO₂(g)',-393.5],['CO(g) + ½O₂(g) → CO₂(g)',-283.0]],a:[2,-2]},{t:'C(s) + 2H₂(g) → CH₄(g)',H:-74.8,r:[['C(s) + O₂(g) → CO₂(g)',-393.5],['H₂(g) + ½O₂(g) → H₂O(l)',-285.8],['CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(l)',-890.3]],a:[1,2,-1]},{t:'H₂(g) + ½O₂(g) → H₂O(g)',H:-241.8,r:[['H₂(g) + ½O₂(g) → H₂O(l)',-285.8],['H₂O(g) → H₂O(l)',-44.0]],a:[1,-1]}];let hl=0;
P.hess=()=>`<h2>🧩 Hess’s Law Puzzle</h2><div class="card"><h3>1️⃣ Metode penjumlahan persamaan</h3><p><b>Langkah:</b> (1) tulis reaksi target; (2) balik reaksi bila zat target ada di ruas yang berlawanan (tanda ΔH berubah); (3) kalikan agar koefisien sama (ΔH ikut dikali); (4) jumlahkan persamaan dan coret zat yang sama di kedua ruas; (5) jumlahkan ΔH.</p><p>Perubahan entalpi hanya bergantung pada keadaan awal dan akhir. Jika reaksi berlangsung bertahap, ΔH total = jumlah ΔH tiap tahap. Atur setiap reaksi (pengali dan balik) sehingga jumlahnya menjadi reaksi target.</p><div class="row">${HL.map((_,i)=>`<button class="btn alt" onclick="hlv(${i})">Level ${i+1}</button>`).join('')}</div><div id="hz"></div></div>${HX()}${doneBtn('hess')}`;
function hlv(i){hl=i;const L=HL[i];$('hz').innerHTML=`<div class="box"><b>Target:</b> ${L.t} &nbsp; ΔH = ? kJ</div>${L.r.map((r,j)=>`<div class="box">${r[0]}  ΔH = ${f(r[1])} kJ<div class="row"><label>Pengali <select id="hm${j}" onchange="hsum()"><option>0</option><option>0.5</option><option>1</option><option>2</option></select></label><label><input type="checkbox" id="hr${j}" onchange="hsum()"> Balik</label><span id="hd${j}"></span></div></div>`).join('')}<p><b id="hs2"></b></p><button class="btn" onclick="hchk()">Periksa jawaban</button><div id="hc"></div>`;hsum()}
function hf(){return HL[hl].r.map((r,j)=>(+$('hm'+j).value)*($('hr'+j).checked?-1:1))}
function hsum(){const L=HL[hl],fs=hf();let s=0;L.r.forEach((r,j)=>{const v=fs[j]*r[1];s+=v;$('hd'+j).textContent=fs[j]?'→ ΔH dipakai: '+f(v)+' kJ':'(tidak dipakai)'});$('hs2').textContent='ΔH total = '+f(s)+' kJ'}
function hchk(){const L=HL[hl],fs=hf(),ok=fs.every((x,j)=>x===L.a[j]);$('hc').innerHTML=ok?`<p class="ok">✅ Benar! ΔH = ${f(L.H)} kJ. Reaksi yang sama di kedua ruas saling meniadakan sehingga tersisa reaksi target.</p>`:'<p class="err">❌ Belum cocok. Petunjuk: zat target di ruas kiri harus berasal dari reaktan reaksi yang dipakai searah; jika ia muncul di ruas yang salah, balik reaksinya. Lalu samakan koefisien.</p>';if(ok){once('hess'+hl,40,'puzzle Hess');if(!S.got['hc'+hl]){S.got['hc'+hl]=1;cnt('hess')}}else beep(0)}
I.hess=()=>hlv(hl);
/* KALKULATOR */
const rowH=(id,n,ph)=>Array.from({length:n},(_,i)=>`<div class="r3"><input id="${id}n${i}" placeholder="${ph[0]}" aria-label="${ph[0]} ${i+1}"><input id="${id}k${i}" type="number" step="any" placeholder="${ph[1]}" aria-label="${ph[1]} ${i+1}"><input id="${id}v${i}" type="number" step="any" placeholder="${ph[2]}" aria-label="${ph[2]} ${i+1}"></div>`).join('');
const rd=(id,n,int)=>{const r=[];for(let i=0;i<n;i++){const nm=$(id+'n'+i).value.trim(),k=$(id+'k'+i).value,v=$(id+'v'+i).value;if(!nm&&k===''&&v==='')continue;if(k===''||v==='')throw 'Baris '+(i+1)+' belum lengkap';if(+k<=0||(int&&!Number.isInteger(+k)))throw 'Baris '+(i+1)+': '+(int?'jumlah ikatan harus bilangan bulat positif':'koefisien harus lebih dari 0');r.push({nm:nm||'zat '+(i+1),k:+k,v:+v})}if(!r.length)throw 'Isi minimal satu baris pada tabel';return r};
const fill=(id,rows)=>{for(let i=0;i<4;i++){const r=rows[i]||['','',''];$(id+'n'+i).value=r[0];$(id+'k'+i).value=r[1];$(id+'v'+i).value=r[2]}};
let kt='kalor';
P.kalk=()=>`<h2>🧮 Thermo Calculator</h2><div class="row">${[['kalor','Kalor'],['molar','ΔH molar'],['hf','ΔH°f'],['bond','Energi ikatan']].map(t=>`<button class="btn alt" onclick="kt='${t[0]}';kc()">${t[1]}</button>`).join('')}<button class="btn alt" onclick="go('hess')">Hess</button></div><div class="card" id="kc"></div>${doneBtn('kalk')}`;
const KR={kalor:`<h3>Kalor: q = m·c·ΔT</h3><div class="grid"><div><label for="k1">Massa</label><input id="k1" type="number" step="any"></div><div><label for="ku">Satuan massa</label><select id="ku"><option>g</option><option>kg</option></select></div><div><label for="k2">Kalor jenis (J/g°C)</label><input id="k2" type="number" step="any"></div><div><label for="k3">Suhu awal (°C)</label><input id="k3" type="number" step="any"></div><div><label for="k4">Suhu akhir (°C)</label><input id="k4" type="number" step="any"></div></div><button class="btn" onclick="ck1()">Hitung</button><button class="btn alt" onclick="kex('kalor')">Contoh</button><button class="btn alt" onclick="kc()">Reset</button>`,
molar:`<h3>ΔH molar = q ÷ n</h3><p><small>Gunakan q reaksi pada tekanan konstan dan n = mol zat sesuai definisi reaksi.</small></p><div class="grid"><div><label for="q1">Kalor reaksi (besar)</label><input id="q1" type="number" step="any"></div><div><label for="qu">Satuan</label><select id="qu"><option>J</option><option>kJ</option></select></div><div><label for="q2">Mol zat (n)</label><input id="q2" type="number" step="any"></div><div><label for="q3">Jenis proses</label><select id="q3"><option value="x">Kalor dilepas (eksoterm)</option><option value="n">Kalor diserap (endoterm)</option></select></div></div><button class="btn" onclick="ck2()">Hitung</button><button class="btn alt" onclick="kex('molar')">Contoh</button><button class="btn alt" onclick="kc()">Reset</button>`,
hf:`<h3>ΔH° reaksi = Σν·ΔH°f(produk) − Σν·ΔH°f(reaktan)</h3><p><small>Kolom: nama zat (fase) · koefisien · ΔH°f (kJ/mol). Unsur bentuk standar = 0.</small></p><b>Produk</b>${rowH('fp',4,['Zat','ν','ΔH°f'])}<b>Reaktan</b>${rowH('fr',4,['Zat','ν','ΔH°f'])}<button class="btn" onclick="ck3()">Hitung</button><button class="btn alt" onclick="kex('hf')">Contoh</button><button class="btn alt" onclick="kc()">Reset</button>`,
bond:`<h3>ΔH ≈ Σ E(diputus) − Σ E(terbentuk)</h3><p><small>Kolom: jenis ikatan · jumlah · energi (kJ/mol). Hasilnya perkiraan.</small></p><b>Ikatan diputus</b>${rowH('bb',4,['Ikatan','Jumlah','E'])}<b>Ikatan terbentuk</b>${rowH('bf',4,['Ikatan','Jumlah','E'])}<button class="btn" onclick="ck4()">Hitung</button><button class="btn alt" onclick="kex('bond')">Contoh</button><button class="btn alt" onclick="kc()">Reset</button>`};
function kc(){$('kc').innerHTML=KR[kt]+'<div id="ko"></div>'}
function kex(t){if(t==='kalor'){$('k1').value=100;$('k2').value=4.18;$('k3').value=25;$('k4').value=30}if(t==='molar'){$('q1').value=2842;$('q2').value=0.05;$('q3').value='x'}if(t==='hf'){fill('fp',[['CO₂(g)',1,-393.5],['H₂O(l)',2,-285.8]]);fill('fr',[['CH₄(g)',1,-74.8],['O₂(g)',2,0]])}if(t==='bond'){fill('bb',[['C–H',4,413],['O=O',2,498]]);fill('bf',[['C=O',2,799],['O–H',4,463]])}}
function ck1(){try{let m=num('k1','Massa');if($('ku').value==='kg')m*=1000;const c=num('k2','Kalor jenis'),a=num('k3','Suhu awal',null),b=num('k4','Suhu akhir',null),d=b-a,q=m*c*d;out('ko',`<div class="box">ΔT = ${f(b)} − ${f(a)} = ${f(d,2)} °C<br>q = ${f(m,1)} g × ${f(c,2)} J/g°C × ${f(d,2)} °C = <b>${f(q,0)} J = ${f(q/1000,3)} kJ</b><br>${q>0?'q positif: zat menyerap kalor (suhu naik).':q<0?'q negatif: zat melepas kalor (suhu turun).':'Tidak ada perubahan suhu.'}</div>`);once('k_kalor',15,'kalkulator kalor')}catch(e){out('ko','',e)}}
function ck2(){try{let q=num('q1','Kalor');const n=num('q2','Mol');if($('qu').value==='J')q/=1000;const dh=($('q3').value==='x'?-1:1)*q/n;out('ko',`<div class="box">ΔH = ±q ÷ n = ${$('q3').value==='x'?'−':'+'}${f(q,3)} kJ ÷ ${f(n,3)} mol = <b>${f(dh)} kJ/mol</b><br>${dh<0?'Tanda negatif: eksoterm.':'Tanda positif: endoterm.'}</div>`);once('k_molar',15,'kalkulator molar')}catch(e){out('ko','',e)}}
function ck3(){try{const p=rd('fp',4),r=rd('fr',4),sp=p.reduce((s,x)=>s+x.k*x.v,0),sr=r.reduce((s,x)=>s+x.k*x.v,0),d=sp-sr;out('ko',`<div class="box">Σ produk = ${p.map(x=>x.k+'×('+f(x.v)+')').join(' + ')} = ${f(sp)} kJ<br>Σ reaktan = ${r.map(x=>x.k+'×('+f(x.v)+')').join(' + ')} = ${f(sr)} kJ<br>ΔH° = ${f(sp)} − (${f(sr)}) = <b>${f(d)} kJ</b><br>${d<0?'Negatif → eksoterm.':'Positif → endoterm.'}</div>`);once('k_hf',15,'kalkulator ΔH°f')}catch(e){out('ko','',e)}}
function ck4(){try{const b=rd('bb',4,1),g=rd('bf',4,1),sb=b.reduce((s,x)=>s+x.k*x.v,0),sg=g.reduce((s,x)=>s+x.k*x.v,0),d=sb-sg;out('ko',`<div class="box">Diputus (butuh energi) = ${b.map(x=>x.k+'×'+f(x.v,0)).join(' + ')} = ${f(sb,0)} kJ<br>Terbentuk (melepas energi) = ${g.map(x=>x.k+'×'+f(x.v,0)).join(' + ')} = ${f(sg,0)} kJ<br>ΔH ≈ ${f(sb,0)} − ${f(sg,0)} = <b>${f(d,0)} kJ</b><br>${d<0?'Energi dilepas lebih besar → eksoterm.':'Energi diperlukan lebih besar → endoterm.'}<br><small>Energi ikatan adalah rata-rata, jadi ini perkiraan, bukan nilai eksperimen persis.</small></div>`);once('k_bond',15,'kalkulator ikatan');cnt('bond')}catch(e){out('ko','',e)}}
I.kalk=kc;

P.hidup=()=>`<h2>🌍 Energy in Real Life</h2><div class="grid">${[['🔥 Pembakaran bahan bakar','Energi kimia → kalor. Bandingkan ΔH°c per mol atau per gram, fase produk, dan efisiensi; satu angka ΔH tidak cukup untuk menyebut bahan bakar “terbaik”.','Mengapa membandingkan per gram bisa memberi urutan berbeda dari per mol?'],['❄️ Kompres dingin instan','Pelarutan zat (mis. NH₄NO₃) menyerap kalor dari air sehingga suhu turun (endoterm).','Ke mana kalor mengalir? Siapa sistem dan siapa lingkungan?'],['♨️ Kompres panas','Paket penghangat memanfaatkan proses/reaksi yang melepas kalor (eksoterm); mekanisme bergantung bahan yang digunakan.','Apa tanda ΔH proses ini?'],['🍳 Memasak','Kalor dari kompor menaikkan suhu bahan dan memicu perubahan fisika/kimia pada makanan.','Mana yang berubah: suhu, fase, atau komposisi?'],['🌱 Fotosintesis','Membutuhkan energi cahaya; berupa rangkaian reaksi kompleks, bukan sekadar pembakaran terbalik.','Apakah proses ini eksoterm atau endoterm secara keseluruhan?'],['🧂 Pelarutan zat','Ada yang melepas kalor (NaOH), ada yang menyerap (NH₄NO₃).','Bagaimana menentukan jenisnya dari data suhu?']].map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p><details><summary>Pertanyaan analitis</summary>${c[2]}</details></div>`).join('')}</div>${doneBtn('hidup')}`;
P.pus=()=>`<h2>💡 Energy Knowledge Center</h2><div class="card"><h3>Glosarium</h3>${[['Termokimia','Kajian kalor yang menyertai reaksi.'],['Sistem / Lingkungan','Bagian yang diamati / segala sesuatu di luarnya.'],['Kalor (q)','Energi yang berpindah karena beda suhu, satuan J.'],['Entalpi (H)','Kandungan energi sistem pada tekanan konstan; ΔH diukur.'],['Eksoterm / Endoterm','ΔH < 0 / ΔH > 0.'],['Kalor jenis (c)','Kalor untuk menaikkan 1 g zat sebesar 1 °C.'],['Kapasitas kalor (C)','Kalor untuk menaikkan suhu suatu benda 1 °C, J/°C.'],['Hukum Hess','ΔH hanya bergantung keadaan awal dan akhir.'],['ΔH°f','Pembentukan 1 mol senyawa dari unsur standar.'],['Energi ikatan','Energi rata-rata untuk memutus 1 mol ikatan (gas).']].map(g=>`<p><b>${g[0]}</b>: ${g[1]}</p>`).join('')}</div>

P.prof=()=>{const l=lv(),all=M.every(m=>S.done[m])&&(S.best[4]||0)>=80;return `<h2>🏆 Profil</h2>${all?`<div class="hero"><h1>CONGRATULATIONS, THERMOCHEMISTRY CHAMPION!</h1><p>Kamu telah menjelajahi dunia energi dalam reaksi kimia! Dari kalorimetri hingga Hukum Hess, setiap perhitungan membantumu memahami bagaimana energi berubah dan berpindah. Teruslah bereksperimen, berpikir kritis, dan menemukan keajaiban kimia di sekitarmu!</p></div>`:''}
<div class="card"><h3>${LV[l][2]} ${LV[l][1]} · ${S.xp} XP</h3><div class="grid">${LV.map((v,i)=>`<div class="chip">${i<=l?'✅':'🔒'} ${v[2]} ${v[1]} (${v[0]} XP)</div>`).join('')}</div></div>
<div class="card"><h3>Lencana</h3><div class="grid">${BD.map((b,i)=>`<div class="bdg ${S.b[i]?'got':''}"><span>${b[0]}</span><br><b>${b[1]}</b><br><small>${S.b[i]?'Diperoleh':'Terkunci: '+b[2]}</small></div>`).join('')}</div></div>
<div class="card"><h3>Riwayat eksperimen</h3>${S.hist.length?'<ul>'+S.hist.map(h=>`<li>${h}</li>`).join('')+'</ul>':'<p>Belum ada eksperimen.</p>'}</div>
<div class="card"><h3>Pengaturan</h3><p><small>Progres disimpan di browser dan perangkat ini saja (localStorage), tidak tersinkron antarperangkat.</small></p><button class="btn alt" onclick="if(confirm('Atur ulang semua progres?')){S={...D};save();apply();top_();go('dash')}">Reset progres</button></div>`};
/* BG PARTICLES */
(function(){const c=$('bg'),x=c.getContext('2d');let w,h,p=[];const cols=['#5b4bff','#ff5a36','#1ab7ea','#ffd24a','#b84bff'];function rs(){w=c.width=innerWidth;h=c.height=innerHeight}rs();addEventListener('resize',rs);for(let i=0;i<36;i++)p.push({x:Math.random()*2000,y:Math.random()*1200,r:2+Math.random()*5,v:.2+Math.random()*.6,c:cols[i%5]});
(function l(){x.clearRect(0,0,w,h);if(!S.calm&&!matchMedia('(prefers-reduced-motion:reduce)').matches){p.forEach(q=>{q.y-=q.v;if(q.y<-10){q.y=h+10;q.x=Math.random()*w}x.globalAlpha=.25;x.fillStyle=q.c;x.beginPath();x.arc(q.x%w,q.y,q.r,0,7);x.fill()})}requestAnimationFrame(l)})()})();
/* INIT */
$('nav').innerHTML=Object.entries(N).map(([k,v])=>`<button class="nb" data-p="${k}" onclick="go('${k}')">${v[0]} ${v[1]}</button>`).join('');
apply();top_();addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(P[h]&&h!==S.last)go(h)});
go(P[location.hash.slice(1)]?location.hash.slice(1):'dash');
</script></body></html>
